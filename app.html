<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BartolomewTT</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4f6ef7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BartolomewTT">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<style>
  :root{
    --bg:#f5f6fb; --card:#fff; --text:#1b1f2a; --muted:#6b7280; --line:#e6e8f0;
    --accent:#4f6ef7; --accent-text:#fff;
    --high:#ef4444; --medium:#f59e0b; --low:#10b981;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#101219;--card:#191c25;--text:#e9ebf3;--muted:#98a0b3;--line:#2a2f3d;--accent:#7c93ff;}
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:32px 16px;background:var(--bg);color:var(--text);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .app{width:100%;max-width:640px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:21px;margin:0;letter-spacing:-.01em}
  .day-nav{display:flex;align-items:center;gap:6px}
  .day-nav input[type=date]{
    padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font:inherit
  }
  button{
    font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);
    border-radius:9px;padding:8px 12px;transition:border-color .15s,background .15s
  }
  button:hover{border-color:var(--accent)}
  .icon{width:36px;padding:8px 0;text-align:center}
  form{
    display:grid;grid-template-columns:1fr auto auto;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:18px
  }
  form input[type=text]{
    grid-column:1/-1;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    background:transparent;color:var(--text);font:inherit;min-width:0
  }
  form input[type=text]:focus,form select:focus,.day-nav input:focus{outline:2px solid var(--accent);outline-offset:1px}
  form select,form input[type=date]{
    padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);font:inherit
  }
  form button[type=submit]{background:var(--accent);color:var(--accent-text);border-color:transparent;font-weight:600}
  form button[type=submit]:hover{filter:brightness(1.07)}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .task{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--line);border-radius:11px;padding:11px 12px
  }
  .task.prio-high{border-left-color:var(--high)}
  .task.prio-medium{border-left-color:var(--medium)}
  .task.prio-low{border-left-color:var(--low)}
  .task.done{opacity:.55}
  .task.done .task__text{text-decoration:line-through}
  .task__check{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;flex:0 0 auto}
  .task__text{flex:1;min-width:0;overflow-wrap:anywhere}
  .task__prio{font-size:12px;color:var(--muted);white-space:nowrap}
  .task__moved{font-size:12px;color:var(--muted);white-space:nowrap}
  .task__date{font-size:12px;color:var(--muted);white-space:nowrap}
  .task__restore{font-size:12px;padding:4px 8px}
  .modes{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .modes button{border:0;border-radius:0;padding:8px 12px}
  .modes button+button{border-left:1px solid var(--line)}
  .modes button.active{background:var(--accent);color:var(--accent-text);font-weight:600}
  .modes button:disabled{opacity:.55;cursor:default}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
  .tools[hidden]{display:none}
  .tools input[type=search]{
    flex:1 1 190px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--card);color:var(--text);font:inherit
  }
  .tools input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .filters button{padding:8px 10px;font-size:13px}
  .filters button.active{background:var(--accent);color:var(--accent-text);border-color:transparent}
  .week{display:flex;flex-direction:column;gap:16px}
  .week[hidden]{display:none}
  ul[hidden]{display:none}
  .week-day__head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .week-day__title{font-weight:600}
  .week-day__stats{color:var(--muted);font-size:12px}
  .week-day__move{font-size:12px;padding:4px 8px;margin-left:auto}
  .week-day .empty{padding:10px 0;text-align:left}
  form[hidden]{display:none}
  .task__del{
    border:0;background:transparent;color:var(--muted);padding:2px 6px;border-radius:7px;line-height:1
  }
  .task__del:hover{color:var(--high);background:transparent}
  .empty{color:var(--muted);text-align:center;padding:26px 0;margin:0}
  footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;color:var(--muted);font-size:13px}
  footer button{font-size:13px;padding:6px 10px}
  .error{color:var(--high);font-size:13px;margin:10px 0 0;overflow-wrap:anywhere}
  .modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal[hidden]{display:none}
  .modal__backdrop{position:absolute;inset:0;background:rgba(10,12,20,.45)}
  .modal__card{position:relative;width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 18px 40px rgba(10,12,20,.22)}
  .modal__title{margin:0 0 6px;font-size:17px}
  .modal__text{margin:0 0 16px;color:var(--muted);overflow-wrap:anywhere}
  .modal__actions{display:flex;justify-content:flex-end;gap:8px}
  .modal__confirm{background:var(--high);border-color:transparent;color:#fff;font-weight:600}
  .modal__confirm:hover{filter:brightness(1.07);border-color:transparent}
  /* ---------- карточки дней недели ---------- */
  .week-day{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0
  }
  .week-day__head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0}
  .week-day ul{gap:2px}
  .week-day .task{background:transparent;border:0;border-left:2px solid var(--line);border-radius:0;padding:5px 0 5px 8px}
  .week-day .task.prio-high{border-left-color:var(--high)}
  .week-day .task.prio-medium{border-left-color:var(--medium)}
  .week-day .task.prio-low{border-left-color:var(--low)}
  .week-day .task__del{min-height:32px;min-width:32px}
  .task__check-wrap{display:flex;align-items:center;justify-content:center;flex:0 0 auto;min-width:26px;min-height:26px}

  body{padding:16px 12px calc(16px + env(safe-area-inset-bottom)) 12px}

  @media (max-width: 600px){
    body{padding:12px 12px calc(12px + env(safe-area-inset-bottom)) 12px;font-size:16px}
    header{flex-direction:column;align-items:stretch;gap:10px}
    h1{font-size:19px;text-align:center}
    .day-nav{display:flex;flex-wrap:wrap;gap:8px}
    .modes{order:-1;flex:1 1 100%;display:flex}
    .modes button{flex:1;min-height:44px;padding:10px 8px}
    .day-nav input[type=date]{flex:1 1 110px;min-width:0;font-size:16px;min-height:44px;padding:10px}
    #today,#archive-toggle{flex:1 1 45%}
    button{min-height:44px;padding:10px 12px;font-size:15px}
    .icon{min-width:44px;min-height:44px}
    form{grid-template-columns:1fr auto;padding:12px;gap:10px}
    form input[type=text]{font-size:16px;min-height:48px;padding:12px}
    form select,form input[type=date]{font-size:16px;min-height:44px;padding:10px}
    .tools{gap:10px}
    .tools input[type=search]{flex:1 1 100%;font-size:16px;min-height:44px;padding:10px 12px}
    .filters{flex:1 1 100%}
    .filters button{flex:1;min-height:44px;font-size:14px;padding:8px 6px}
    .task{padding:10px 12px;min-height:52px;gap:8px}
    .task__text{font-size:16px}
    .task__check{width:26px;height:26px}
    .task__check-wrap{min-width:44px;min-height:44px;margin:-8px 0}
    .task__del{min-height:44px;min-width:44px;font-size:16px}
    .week-day__move{min-height:40px;margin-left:0}
    footer{flex-direction:column;align-items:stretch;gap:10px}
    footer button{min-height:44px}
    .modal__card{padding:16px}
    .modal__actions button{min-height:44px;flex:1}
  }

  @media (min-width: 1000px){
    .app{max-width:1080px}
    .week{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:14px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>BartolomewTT</h1>
    <div class="day-nav">
      <button class="icon" id="prev-day" type="button" title="Предыдущий день">←</button>
      <input type="date" id="view-date" aria-label="Выбранный день">
      <button class="icon" id="next-day" type="button" title="Следующий день">→</button>
      <button id="today" type="button">Сегодня</button>
      <div class="modes" role="group" aria-label="Вид">
        <button type="button" id="mode-day" class="active">День</button>
        <button type="button" id="mode-week">Неделя</button>
      </div>
      <button id="archive-toggle" type="button">Архив</button>
    </div>
  </header>

  <form id="add-form" autocomplete="off">
    <input type="text" id="task-text" placeholder="Что нужно сделать?" maxlength="200" required>
    <input type="date" id="task-date" aria-label="Дата задачи">
    <select id="task-priority" aria-label="Приоритет">
      <option value="high">Высокий</option>
      <option value="medium" selected>Средний</option>
      <option value="low">Низкий</option>
    </select>
    <button type="submit">Добавить</button>
  </form>

  <div class="tools" id="tools">
    <input type="search" id="search" placeholder="Поиск по тексту" aria-label="Поиск по тексту">
    <div class="filters" id="filters" role="group" aria-label="Приоритет">
      <button type="button" data-prio="all" class="active">Все</button>
      <button type="button" data-prio="high">Высокий</button>
      <button type="button" data-prio="medium">Средний</button>
      <button type="button" data-prio="low">Низкий</button>
    </div>
  </div>

  <ul id="task-list"></ul>
  <p class="empty" id="empty">На этот день задач нет</p>
  <div class="week" id="week" hidden></div>

  <footer>
    <span id="stats"></span>
    <button type="button" id="move-tomorrow" hidden>Перенести на завтра</button>
    <button type="button" id="clear-done" hidden>Убрать выполненные</button>
  </footer>
  <p class="error" id="error" hidden></p>

  <div class="modal" id="delete-modal" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
      <h2 class="modal__title" id="delete-modal-title">Удалить задачу?</h2>
      <p class="modal__text" id="delete-modal-text"></p>
      <div class="modal__actions">
        <button type="button" id="delete-cancel">Отмена</button>
        <button type="button" class="modal__confirm" id="delete-confirm">Удалить</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var PRIORITIES = {
    high:   { label: "Высокий" },
    medium: { label: "Средний" },
    low:    { label: "Низкий" }
  };

  var els = {
    form: document.getElementById("add-form"),
    text: document.getElementById("task-text"),
    date: document.getElementById("task-date"),
    priority: document.getElementById("task-priority"),
    view: document.getElementById("view-date"),
    prev: document.getElementById("prev-day"),
    next: document.getElementById("next-day"),
    today: document.getElementById("today"),
    list: document.getElementById("task-list"),
    empty: document.getElementById("empty"),
    stats: document.getElementById("stats"),
    clearDone: document.getElementById("clear-done"),
    archiveToggle: document.getElementById("archive-toggle"),
    modeDay: document.getElementById("mode-day"),
    modeWeek: document.getElementById("mode-week"),
    tools: document.getElementById("tools"),
    search: document.getElementById("search"),
    filters: document.getElementById("filters"),
    week: document.getElementById("week"),
    moveTomorrow: document.getElementById("move-tomorrow"),
    error: document.getElementById("error"),
    modal: document.getElementById("delete-modal"),
    modalText: document.getElementById("delete-modal-text"),
    modalCancel: document.getElementById("delete-cancel"),
    modalConfirm: document.getElementById("delete-confirm")
  };

  var tasks = [];
  var viewDate = todayISO();
  var pendingDelete = null;
  var mode = "day";
  var modeBeforeArchive = "day";
  var priorityFilter = "all";

  function pad(n) { return String(n).padStart(2, "0"); }
  function toISO(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayISO() { return toISO(new Date()); }
  function addDays(iso, n) {
    var p = iso.split("-").map(Number);
    var d = new Date(p[0], p[1] - 1, p[2]);
    d.setDate(d.getDate() + n);
    return toISO(d);
  }

  function showError(message) {
    els.error.textContent = message || "";
    els.error.hidden = !message;
  }

  function api(method, path, body) {
    var options = { method: method, headers: {} };
    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    return fetch(path, options).then(function (response) {
      return response.text().then(function (raw) {
        var data = null;
        if (raw) {
          try { data = JSON.parse(raw); } catch (err) { data = null; }
        }
        if (!response.ok) {
          var message = (data && data.error) ? data.error : ("HTTP " + response.status);
          throw new Error(message);
        }
        return data;
      });
    });
  }

  function weekStart(iso) {
    var p = iso.split("-").map(Number);
    var d = new Date(p[0], p[1] - 1, p[2]);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return toISO(d);
  }

  var WEEKDAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

  function sortDay(list) {
    return list.slice().sort(function (a, b) {
      if (!!a.done !== !!b.done) return a.done ? 1 : -1;
      return a.created_at - b.created_at;
    });
  }

  function visibleTasks() {
    if (priorityFilter === "all") return tasks;
    return tasks.filter(function (t) { return t.priority === priorityFilter; });
  }

  function buildTask(t, isArchive) {
    var li = document.createElement("li");
    li.className = "task prio-" + t.priority + (!isArchive && t.done ? " done" : "");

    var text = document.createElement("span");
    text.className = "task__text";
    text.textContent = t.text;

    var prio = document.createElement("span");
    prio.className = "task__prio";
    prio.textContent = PRIORITIES[t.priority] ? PRIORITIES[t.priority].label : "";

    if (isArchive) {
      var dateLabel = document.createElement("span");
      dateLabel.className = "task__date";
      dateLabel.textContent = t.date;

      var restore = document.createElement("button");
      restore.type = "button";
      restore.className = "task__restore";
      restore.textContent = "Вернуть";
      restore.addEventListener("click", function () {
        showError("");
        api("POST", "/api/tasks/" + encodeURIComponent(t.id) + "/restore")
          .then(load)
          .catch(function (err) { showError("Не удалось вернуть задачу: " + err.message); });
      });

      li.append(text, prio, dateLabel, restore);
      return li;
    }

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "task__check";
    cb.checked = !!t.done;
    cb.setAttribute("aria-label", "Отметить выполненной");
    var checkWrap = document.createElement("label");
    checkWrap.className = "task__check-wrap";
    checkWrap.append(cb);

    cb.addEventListener("change", function () {
      var nextDone = cb.checked;
      showError("");
      api("PATCH", "/api/tasks/" + encodeURIComponent(t.id), { done: nextDone })
        .then(load)
        .catch(function (err) {
          cb.checked = !nextDone;
          showError("Не удалось сохранить отметку: " + err.message);
        });
    });

    var del = document.createElement("button");
    del.type = "button";
    del.className = "task__del";
    del.textContent = "✕";
    del.title = "Удалить";
    del.addEventListener("click", function () {
      openDeleteModal(t);
    });

    li.append(checkWrap, text);
    if (t.moved > 0) {
      var moved = document.createElement("span");
      moved.className = "task__moved";
      moved.textContent = "перенос ×" + t.moved;
      li.append(moved);
    }
    li.append(prio, del);
    return li;
  }

  function setModeButtons(isArchive) {
    els.modeDay.disabled = isArchive;
    els.modeWeek.disabled = isArchive;
    els.modeDay.classList.toggle("active", mode === "day");
    els.modeWeek.classList.toggle("active", mode === "week");
  }

  function renderWeek() {
    var start = weekStart(viewDate);
    var byDate = {};
    visibleTasks().forEach(function (t) {
      if (!byDate[t.date]) byDate[t.date] = [];
      byDate[t.date].push(t);
    });

    for (var i = 0; i < 7; i++) {
      var day = addDays(start, i);
      var parts = day.split("-");
      var list = sortDay(byDate[day] || []);
      var done = list.filter(function (t) { return !!t.done; }).length;

      var block = document.createElement("section");
      block.className = "week-day";

      var head = document.createElement("div");
      head.className = "week-day__head";

      var title = document.createElement("span");
      title.className = "week-day__title";
      title.textContent = WEEKDAYS[i] + ", " + parts[2] + "." + parts[1];

      var stats = document.createElement("span");
      stats.className = "week-day__stats";
      stats.textContent = list.length ? "выполнено " + done + " из " + list.length : "";

      head.append(title, stats);

      if (done < list.length) {
        var move = document.createElement("button");
        move.type = "button";
        move.className = "week-day__move";
        move.textContent = "Незакрытые →";
        move.title = "Перенести незакрытые задачи на следующий день";
        move.addEventListener("click", (function (d) {
          return function () {
            showError("");
            api("POST", "/api/tasks/move-unfinished", { date: d })
              .then(load)
              .catch(function (err) {
                showError("Не удалось перенести задачи: " + err.message);
              });
          };
        })(day));
        head.append(move);
      }

      block.append(head);

      if (list.length) {
        var ul = document.createElement("ul");
        list.forEach(function (t) { ul.append(buildTask(t, false)); });
        block.append(ul);
      } else {
        var empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Задач нет";
        block.append(empty);
      }

      els.week.append(block);
    }
  }

  function render() {
    var isArchive = mode === "archive";
    var isWeek = mode === "week";
    var filtered = isArchive ? tasks.slice() : visibleTasks();
    var searched = els.search.value.trim().length > 0;

    els.view.value = viewDate;
    els.view.disabled = isArchive || isWeek;
    els.prev.disabled = isArchive;
    els.next.disabled = isArchive;
    els.today.disabled = isArchive;
    els.form.hidden = isArchive;
    els.tools.hidden = isArchive;
    els.list.hidden = isWeek;
    els.week.hidden = !isWeek;
    els.week.textContent = "";
    setModeButtons(isArchive);

    if (isWeek) {
      renderWeek();
      var weekDone = filtered.filter(function (t) { return !!t.done; }).length;
      els.empty.hidden = true;
      els.stats.textContent = filtered.length
        ? "Выполнено " + weekDone + " из " + filtered.length + " за неделю"
        : "";
      els.clearDone.hidden = true;
      els.moveTomorrow.hidden = true;
      return;
    }

    var sorted = isArchive ? filtered : sortDay(filtered);
    els.list.textContent = "";
    sorted.forEach(function (t) { els.list.append(buildTask(t, isArchive)); });

    var finished = sorted.filter(function (t) { return !!t.done; }).length;
    els.empty.hidden = sorted.length > 0;
    els.empty.textContent = isArchive
      ? "Архив пуст"
      : (searched || priorityFilter !== "all" ? "Ничего не найдено" : "На этот день задач нет");
    els.stats.textContent = isArchive
      ? (sorted.length ? "В архиве " + sorted.length : "")
      : (sorted.length ? "Выполнено " + finished + " из " + sorted.length : "");
    els.clearDone.hidden = isArchive || finished === 0;
    els.moveTomorrow.hidden = isArchive || finished === sorted.length;
  }

  function load() {
    showError("");
    var url;
    if (mode === "archive") {
      url = "/api/archive";
    } else if (mode === "week") {
      var start = weekStart(viewDate);
      url = "/api/tasks?from=" + encodeURIComponent(start) +
            "&to=" + encodeURIComponent(addDays(start, 6));
    } else {
      url = "/api/tasks?date=" + encodeURIComponent(viewDate);
    }
    var q = els.search.value.trim();
    if (q && mode !== "archive") url += "&q=" + encodeURIComponent(q);

    return api("GET", url)
      .then(function (list) {
        tasks = Array.isArray(list) ? list : [];
        render();
      })
      .catch(function (err) {
        tasks = [];
        render();
        showError("Не удалось загрузить задачи: " + err.message);
      });
  }

  function syncFormDate() {
    els.date.value = viewDate;
  }

  els.form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = els.text.value.trim();
    if (!text) return;

    var date = els.date.value || viewDate;
    showError("");
    api("POST", "/api/tasks", { text: text, date: date, priority: els.priority.value })
      .then(function () {
        els.text.value = "";
        if (mode === "day") {
          viewDate = date;
          syncFormDate();
        }
        return load();
      })
      .catch(function (err) {
        showError("Не удалось добавить задачу: " + err.message);
      })
      .then(function () {
        els.text.focus();
      });
  });

  els.prev.addEventListener("click", function () {
    viewDate = addDays(viewDate, mode === "week" ? -7 : -1);
    syncFormDate();
    load();
  });

  els.next.addEventListener("click", function () {
    viewDate = addDays(viewDate, mode === "week" ? 7 : 1);
    syncFormDate();
    load();
  });

  els.today.addEventListener("click", function () {
    viewDate = todayISO();
    syncFormDate();
    load();
  });

  els.view.addEventListener("change", function () {
    if (!els.view.value || mode === "archive") return;
    viewDate = els.view.value;
    syncFormDate();
    load();
  });

  els.archiveToggle.addEventListener("click", function () {
    if (mode === "archive") {
      mode = modeBeforeArchive;
      els.archiveToggle.textContent = "Архив";
    } else {
      modeBeforeArchive = mode;
      mode = "archive";
      els.archiveToggle.textContent = "К задачам";
    }
    load();
  });

  els.clearDone.addEventListener("click", function () {
    if (mode !== "day") return;
    showError("");
    api("POST", "/api/tasks/archive-done", { date: viewDate })
      .then(load)
      .catch(function (err) {
        showError("Не удалось убрать выполненные: " + err.message);
      });
  });

  els.moveTomorrow.addEventListener("click", function () {
    showError("");
    api("POST", "/api/tasks/move-unfinished", { date: viewDate })
      .then(load)
      .catch(function (err) {
        showError("Не удалось перенести задачи: " + err.message);
      });
  });

  els.modeDay.addEventListener("click", function () {
    if (mode === "archive") return;
    mode = "day";
    load();
  });

  els.modeWeek.addEventListener("click", function () {
    if (mode === "archive") return;
    mode = "week";
    load();
  });

  var searchTimer = null;
  els.search.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(load, 250);
  });

  els.filters.addEventListener("click", function (e) {
    var btn = (e.target && e.target.closest)
      ? e.target.closest("button[data-prio]")
      : null;
    if (!btn) return;
    priorityFilter = btn.getAttribute("data-prio");
    Array.prototype.forEach.call(els.filters.querySelectorAll("button"), function (b) {
      b.classList.toggle("active", b === btn);
    });
    render();
  });

  function openDeleteModal(t) {
    pendingDelete = t;
    els.modalText.textContent = t.text;
    els.modal.hidden = false;
    els.modalConfirm.focus();
  }

  function closeDeleteModal() {
    els.modal.hidden = true;
    pendingDelete = null;
  }

  els.modalCancel.addEventListener("click", closeDeleteModal);

  els.modal.addEventListener("click", function (e) {
    if (e.target === els.modal || e.target.className === "modal__backdrop") closeDeleteModal();
  });

  els.modalConfirm.addEventListener("click", function () {
    if (!pendingDelete) return;
    var id = pendingDelete.id;
    showError("");
    api("DELETE", "/api/tasks/" + encodeURIComponent(id))
      .then(function () {
        closeDeleteModal();
        return load();
      })
      .catch(function (err) {
        showError("Не удалось удалить задачу: " + err.message);
      });
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !els.modal.hidden) closeDeleteModal();
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function (err) {
        showError("Не удалось включить офлайн-режим: " + err.message);
      });
    });
  }

  syncFormDate();
  load();
})();
</script>
</body>
</html>
